name: CI — Lint · Test · Build

# ── Standalone CI gate ─────────────────────────────────────────────────────
# Runs on every push and PR to catch issues early, independently of the
# full CD pipeline (deploy-azure.yml). Prevents broken code from landing
# on main or develop branches.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

# Cancel any in-progress run for the same branch/PR on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Frontend deps ─────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint (ESLint)
        run: npm run lint

      # ── Unit tests + coverage ─────────────────────────────────────────────
      - name: Unit tests + coverage
        run: npm run test:ci
        env:
          # Provide stub Firebase env vars so Vite/Vitest doesn't complain
          VITE_FIREBASE_API_KEY: stub
          VITE_FIREBASE_AUTH_DOMAIN: stub.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: stub
          VITE_FIREBASE_STORAGE_BUCKET: stub.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:stub"
          VITE_FIREBASE_MEASUREMENT_ID: G-STUB

      # ── Upload coverage report ────────────────────────────────────────────
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

      # ── Production build ──────────────────────────────────────────────────
      - name: Build Vite bundle
        run: npm run build
        env:
          NODE_ENV: production
          VITE_APP_NAME: "Ankino Youth Hub"
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_API_BASE: /api
          # Stub Firebase vars so the build doesn't fail without secrets
          VITE_FIREBASE_API_KEY: stub
          VITE_FIREBASE_AUTH_DOMAIN: stub.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: stub
          VITE_FIREBASE_STORAGE_BUCKET: stub.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:stub"
          VITE_FIREBASE_MEASUREMENT_ID: G-STUB

      # ── Bundle size report ────────────────────────────────────────────────
      - name: Bundle size report
        run: |
          echo "=== Bundle sizes ==="
          du -sh dist/
          echo "--- JS files ---"
          find dist -name "*.js"  -exec du -h {} \; | sort -rh | head -10
          echo "--- CSS files ---"
          find dist -name "*.css" -exec du -h {} \;
