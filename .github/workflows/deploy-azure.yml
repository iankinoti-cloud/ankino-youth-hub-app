name: CD — Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

# Only one deploy at a time per branch
concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  #  Job 1: CI — Lint · Test · Build
  # ──────────────────────────────────────────────────────────
  ci:
    name: CI (lint · test · build)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: Build Vite bundle
        run: npm run build
        env:
          NODE_ENV:            production
          VITE_APP_VERSION:    ${{ github.sha }}
          VITE_BUILD_TIME:     ${{ github.event.head_commit.timestamp }}
          VITE_API_BASE:       /api
          VITE_APP_NAME:       "Ankino Youth Hub"

      - name: Inject build metadata
        run: |
          echo "{\"version\":\"${{ github.sha }}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\"}" \
            > dist/build-info.json

      - name: Bundle size report
        run: |
          echo "=== Bundle size ==="
          du -sh dist/
          find dist -name "*.js"  -exec du -h {} \; | sort -rh | head -10
          find dist -name "*.css" -exec du -h {} \;

  # ──────────────────────────────────────────────────────────
  #  Job 2: Deploy to Azure Static Web Apps
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy → Azure SWA
    needs: ci
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite bundle
        run: npm run build
        env:
          NODE_ENV:            production
          VITE_APP_VERSION:    ${{ github.sha }}
          VITE_API_BASE:       /api
          VITE_APP_NAME:       "Ankino Youth Hub"

      - name: Inject build metadata
        run: |
          echo "{\"version\":\"${{ github.sha }}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\"}" \
            > dist/build-info.json

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          "upload"
          app_location:                    "/"
          api_location:                    "api"
          output_location:                 "dist"
          app_build_command:               "npm run build"
          # NOTE: Oryx runs the build inside an isolated container, which is
          # cleaner than skip_app_build (which uploaded node_modules and blew
          # the static-file count limit). The earlier `npm run build` step in
          # this job stays for fast-fail + bundle-size reporting.

      - name: Print deployment URL
        if: success()
        run: |
          echo "✅ Deployed Ankino Youth Hub!"
          echo "URL: ${{ steps.deploy.outputs.static_web_app_url }}"

  # ──────────────────────────────────────────────────────────
  #  Job 3: Close PR preview environment
  # ──────────────────────────────────────────────────────────
  close-pr-preview:
    name: Close PR Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure SWA staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action:                          "close"
          app_location:                    "/"

  # ──────────────────────────────────────────────────────────
  #  Job 4: Post-deploy health check
  # ──────────────────────────────────────────────────────────
  health-check:
    name: Health Check
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        run: sleep 20

      - name: Check site health
        run: |
          URL="${{ needs.deploy.outputs.static_web_app_url || secrets.AZURE_SWA_URL }}"
          if [ -z "$URL" ]; then
            echo "⚠️  No URL available — skipping health check"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Site returned $STATUS"
            exit 1
          fi
          echo "✅ Ankino Youth Hub is live at $URL"

      - name: Check API health
        run: |
          URL="${{ needs.deploy.outputs.static_web_app_url || secrets.AZURE_SWA_URL }}"
          if [ -z "$URL" ]; then exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/ai/health")
          echo "API health: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "⚠️  API health check returned $STATUS (may be cold start — non-fatal)"
          else
            echo "✅ API is healthy"
          fi
